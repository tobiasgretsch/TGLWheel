<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='tg_logo.png') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steuerung</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='tokens.css', v=static_version) }}">
    <style>

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: var(--color-bg);
            color: var(--color-text);
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* --- PANELS --- */
        .panel {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 20px;
        }

        h2 {
            margin: 0 0 16px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--color-text-muted);
        }

        /* --- ROWS --- */
        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .row:last-child { margin-bottom: 0; }
        .row-center { align-items: center; }

        .btn-square { flex: 0; min-width: 52px; }

        .size-display {
            min-width: 60px;
            text-align: center;
            font-weight: 700;
        }

        label {
            flex: 1;
            min-width: 160px;
            font-size: 0.9rem;
            color: var(--color-text-muted);
        }

        input[type="number"] {
            width: 90px;
            padding: 10px 12px;
            text-align: center;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 600;
            color: var(--color-text);
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            outline: none;
        }

        input[type="number"]:focus {
            border-color: rgba(255,255,255,0.35);
        }

        /* --- BUTTONS --- */
        button {
            flex: 1;
            min-height: 52px;
            padding: 0 16px;
            font-size: 0.9rem;
            font-family: inherit;
            font-weight: 700;
            letter-spacing: 0.05em;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: #ffffff;
            transition: opacity 0.15s, transform 0.1s;
        }

        button:active  { transform: scale(0.97); }
        button:hover   { opacity: 0.88; }
        button:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

        .btn-green  { background: var(--btn-green); }
        .btn-blue   { background: var(--btn-blue); }
        .btn-red    { background: var(--btn-red); }
        .btn-orange { background: var(--btn-orange); }

        /* --- DIVIDER --- */
        hr {
            border: none;
            border-top: 1px solid var(--color-border);
            margin: 16px 0;
        }

        /* --- SCOREBOARD --- */
        .score-ctrl {
            display: flex;
            gap: 12px;
        }

        .score-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 16px 12px;
        }

        .score-box-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--color-text-muted);
        }

        .score-box button {
            width: 100%;
        }

        .btn-score-plus {
            min-height: 68px;
            font-size: 1.8rem;
        }

        .btn-score-minus {
            min-height: 44px;
            font-size: 1rem;
        }

        .btn-full {
            width: 100%;
            margin-top: 12px;
        }

        /* --- EVENT CHECKLIST --- */
        .event-check-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--color-border);
            cursor: pointer;
            margin-bottom: 8px;
            min-height: 66px;
            user-select: none;
            transition: opacity 0.2s;
        }

        .event-check-item:last-child { margin-bottom: 0; }

        .event-check-item input[type=checkbox] {
            width: 28px;
            height: 28px;
            cursor: pointer;
            accent-color: var(--btn-green);
            flex-shrink: 0;
        }

        .event-check-item img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .event-check-item span {
            font-size: 1rem;
            font-weight: 600;
            flex: 1;
        }

        .event-check-item.event-off {
            opacity: 0.38;
        }

        /* --- POPUP OVERLAY --- */
        .popup-overlay {
            position: fixed;
            inset: 0;
            z-index: 800;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }
        .popup-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .popup-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg, 18px);
            padding: 28px 24px;
            width: 90%;
            max-width: 420px;
            position: relative;
        }
        .popup-card h2 {
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        .popup-close {
            position: absolute;
            top: 14px;
            right: 14px;
            background: none;
            border: none;
            color: var(--color-text-muted);
            font-size: 1.4rem;
            min-height: auto;
            min-width: auto;
            flex: 0;
            padding: 4px 8px;
            cursor: pointer;
        }
        .popup-close:hover { color: var(--color-text); }
        .popup-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .popup-row label {
            flex: 1;
            min-width: 0;
        }
        .popup-row input[type="number"] {
            width: 80px;
        }
        .popup-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .popup-actions button, .popup-actions a {
            text-align: center;
            text-decoration: none;
        }
        .btn-link {
            display: block;
            padding: 12px 16px;
            font-size: 0.85rem;
            font-family: inherit;
            font-weight: 700;
            letter-spacing: 0.05em;
            border: 2px solid var(--btn-blue);
            border-radius: var(--radius-sm);
            color: var(--btn-blue);
            background: transparent;
            cursor: pointer;
            transition: opacity 0.15s;
            min-height: auto;
            flex: 0;
        }
        .btn-link:hover { opacity: 0.8; }

        /* --- MATCH SELECTOR --- */
        .match-select {
            width: 100%;
            padding: 12px 14px;
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 600;
            color: var(--color-text);
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            outline: none;
            appearance: none;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .match-select:focus { border-color: rgba(255,255,255,0.35); }
        .match-select option { background: #1a2332; color: #fff; }
        .match-info {
            text-align: center;
            font-size: 0.8rem;
            color: var(--color-text-muted);
            margin-bottom: 12px;
        }
        .match-info.active {
            color: var(--btn-green);
            font-weight: 700;
            font-size: 0.85rem;
        }

        /* --- STATUS TOAST --- */
        #status-msg {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
        }

        #status-msg.show { opacity: 1; }
        #status-msg.ok   { background: var(--btn-green); }
        #status-msg.err  { background: var(--btn-red); }

        /* --- STATUS BAR (always visible while scrolling) --- */
        .status-bar {
            position: sticky;
            top: 0;
            z-index: 700;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: linear-gradient(var(--color-surface), var(--color-surface)), var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
        }

        .status-clock {
            font-size: 1.9rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .status-clock.expired { color: var(--color-accent); }

        .status-sub {
            margin-top: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--color-text-muted);
        }

        .status-score {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 8px;
            min-width: 0;
        }
        .status-team {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }
        .status-team span {
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-text-muted);
        }
        .status-team b, .status-colon {
            font-size: 1.9rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .status-colon { color: var(--color-text-muted); }

        .status-meta { text-align: right; }
        .conn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .conn-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--btn-red);
        }
        .conn-dot.online { background: var(--btn-green); }

        /* --- CONFIRM-BY-SECOND-TAP --- */
        button.confirming {
            background: var(--color-accent) !important;
            color: #ffffff !important;
            border-color: var(--color-accent) !important;
            animation: confirm-blink 0.6s infinite alternate;
        }
        @keyframes confirm-blink {
            from { box-shadow: 0 0 0 0 var(--color-accent-glow); }
            to   { box-shadow: 0 0 0 6px var(--color-accent-glow); }
        }

        /* --- SETTINGS (collapsed by default) --- */
        details.panel > summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        details.panel > summary::-webkit-details-marker { display: none; }
        details.panel > summary h2 { margin: 0; }
        details.panel > summary::after {
            content: '▸';
            color: var(--color-text-muted);
            transition: transform 0.2s;
        }
        details.panel[open] > summary::after { transform: rotate(90deg); }
        details.panel[open] > summary { margin-bottom: 16px; }

        .shortcut-hint {
            margin: 12px 0 0;
            font-size: 0.75rem;
            color: var(--color-text-muted);
            text-align: center;
        }
        @media (hover: none) {
            .shortcut-hint { display: none; }
        }

        @media (max-width: 420px) {
            body { padding: 12px; }
            .status-bar { gap: 8px; padding: 10px 12px; }
            .status-clock, .status-team b, .status-colon { font-size: 1.5rem; }
            .status-team span { max-width: 64px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- STATUS: what the display currently shows -->
        <header class="status-bar">
            <div>
                <div id="statusClock" class="status-clock">--:--</div>
                <div id="statusClockState" class="status-sub">&nbsp;</div>
            </div>
            <div class="status-score">
                <div class="status-team">
                    <span id="statusLabelLeft">Heim</span>
                    <b id="statusScoreLeft">0</b>
                </div>
                <span class="status-colon">:</span>
                <div class="status-team">
                    <span id="statusLabelRight">Gast</span>
                    <b id="statusScoreRight">0</b>
                </div>
            </div>
            <div class="status-meta">
                <div class="conn"><span id="connDot" class="conn-dot"></span><span id="connText">Verbinde …</span></div>
                <div id="statusPhase" class="status-sub">&nbsp;</div>
                <div id="statusEvents" class="status-sub">&nbsp;</div>
            </div>
        </header>

        <!-- LIVE: everything needed during play -->
        <section class="panel">
            <h2>Live</h2>
            <div class="row">
                <button class="btn-green" id="spinBtn" data-action="spin">RAD DREHEN</button>
                <button class="btn-orange" id="endResultBtn" data-action="end-result" disabled>ERGEBNIS BEENDEN</button>
            </div>
            <div class="row">
                <button class="btn-green" id="startBtn" data-action="timer-start">START</button>
                <button class="btn-red" id="pauseBtn" data-action="timer-stop">PAUSE</button>
            </div>
            <div class="score-ctrl">
                <div class="score-box">
                    <div class="score-box-label" id="scoreLabelLeft">Heim</div>
                    <button class="btn-green btn-score-plus" data-action="score" data-side="left" data-change="1">+1</button>
                    <button class="btn-red   btn-score-minus" data-action="score" data-side="left" data-change="-1">−1</button>
                </div>
                <div class="score-box">
                    <div class="score-box-label" id="scoreLabelRight">Gast</div>
                    <button class="btn-green btn-score-plus" data-action="score" data-side="right" data-change="1">+1</button>
                    <button class="btn-red   btn-score-minus" data-action="score" data-side="right" data-change="-1">−1</button>
                </div>
            </div>
            <button class="btn-orange btn-full" data-action="reset_scores">SPIELSTAND ZURÜCKSETZEN</button>
            <p class="shortcut-hint">Tastatur: Leertaste = Drehen · ← / → = Tor Heim / Gast (mit Umschalt −1) · P = Start / Pause</p>
        </section>

        <!-- AKTUELLES SPIEL -->
        <section id="match-panel" class="panel" style="display:none">
            <h2>Aktuelles Spiel</h2>
            <select id="matchSelect" class="match-select">
                <option value="-1">— Spiel wählen —</option>
            </select>
            <div id="matchInfo" class="match-info">Kein Spiel ausgewählt</div>
            <div class="row">
                <button class="btn-green" data-action="activate-match" style="flex:1">SPIEL LADEN</button>
                <button class="btn-orange" data-action="confirm-score" style="flex:1">ERGEBNIS ÜBERNEHMEN</button>
            </div>
        </section>

        <!-- RAD -->
        <section class="panel">
            <h2>Rad</h2>
            <div class="row">
                <button class="btn-blue" id="eventsBtn" data-action="toggle-events">EREIGNISSE ANZEIGEN</button>
                <button class="btn-orange" data-action="reset">RAD ZURÜCKSETZEN</button>
            </div>
            <div id="events-checklist"></div>
        </section>

        <!-- EINSTELLUNGEN (collapsed: rarely needed during play) -->
        <details class="panel">
            <summary><h2>Einstellungen</h2></summary>
            <div class="row">
                <label for="globalTimeInput">Spielzeit (Minuten):</label>
                <input type="number" id="globalTimeInput" value="10" min="1">
                <button class="btn-blue" data-action="set-timers">SETZEN</button>
            </div>
            <div class="row">
                <label for="resultTimeInput">Ergebnisanzeige (Sekunden):</label>
                <input type="number" id="resultTimeInput" value="60" min="5">
                <button class="btn-blue" data-action="set-result-duration">ÜBERNEHMEN</button>
            </div>

            <hr>

            <div class="row row-center">
                <label>Spielzeit-Schriftgröße:</label>
                <button class="btn-red btn-square" data-action="timer-size-down">−</button>
                <span id="timerSizeDisplay" class="size-display">3.0 rem</span>
                <button class="btn-green btn-square" data-action="timer-size-up">+</button>
            </div>
            <div class="row row-center">
                <label>Punkte-Schriftgröße:</label>
                <button class="btn-red btn-square" data-action="score-size-down">−</button>
                <span id="scoreSizeDisplay" class="size-display">5.0 rem</span>
                <button class="btn-green btn-square" data-action="score-size-up">+</button>
            </div>
        </details>

        <!-- TURNIER -->
        <section class="panel">
            <h2>Turnier</h2>
            <div class="row">
                <button class="btn-green" data-action="create-teams">TEAMS ERSTELLEN</button>
                <button class="btn-orange" data-action="reshuffle-teams">NEU MISCHEN</button>
            </div>
            <div class="row">
                <button class="btn-red" data-action="reset-teams">TEAMS ZURÜCKSETZEN</button>
                <button class="btn-red" data-action="reset-all-teams" style="background:transparent; border:2px solid var(--btn-red); color:var(--btn-red)">ALLES LÖSCHEN</button>
            </div>
            <hr>
            <div class="row">
                <select id="removePlayerSelect" class="match-select" style="margin-bottom:0; flex:1">
                    <option value="">— Spieler entfernen —</option>
                </select>
                <button class="btn-red" data-action="remove-player" style="flex:0; min-width:100px">ENTFERNEN</button>
            </div>
            <hr>
            <button class="btn-blue" data-action="open-tournament" style="width:100%">TURNIEREINSTELLUNGEN</button>
        </section>
    </div>

    <!-- TOURNAMENT SETTINGS POPUP -->
    <div id="tournament-popup" class="popup-overlay">
        <div class="popup-card">
            <button class="popup-close" data-action="close-tournament">&times;</button>
            <h2>Turniereinstellungen</h2>
            <div class="popup-row">
                <label for="numTeamsInput">Anzahl Teams:</label>
                <input type="number" id="numTeamsInput" value="4" min="2" max="20">
            </div>
            <div class="popup-row">
                <label for="numGamesInput">Spiele pro Paarung:</label>
                <input type="number" id="numGamesInput" value="1" min="1" max="3">
            </div>
            <div class="popup-actions">
                <button class="btn-green" data-action="save-tournament">SPEICHERN</button>
                <a href="/teams" target="_blank" class="btn-link">TEAMVERWALTUNG ÖFFNEN</a>
            </div>
        </div>
    </div>

    <div id="status-msg"></div>

    <script>
        // --- CONSTANTS ---
        const CLOCK_TICK_MS = 250;        // status bar clock / button refresh
        const CONFIRM_WINDOW_MS = 3000;   // second tap must follow within this time
        const STATUS_TOAST_MS = 2000;
        const SIZE_STEP_REM = 0.5;
        const TIMER_SIZE_MIN = 1.0, TIMER_SIZE_MAX = 12.0;
        const SCORE_SIZE_MIN = 1.0, SCORE_SIZE_MAX = 20.0;
        // Mirrors SPIN_STALE_SECONDS in app.py. Measured from when this panel first saw
        // the spin, which is never earlier than the server's start, so the button is
        // never re-enabled before the server would accept a new spin.
        const SPIN_STALE_MS = 20000;

        const PHASE_WHEEL = 'wheel', PHASE_SPINNING = 'spinning', PHASE_RESULT = 'result';
        const PHASE_LABELS = { wheel: 'Rad bereit', spinning: 'Rad dreht …', result: 'Ergebnis läuft' };
        const SPIN_LABELS = { wheel: 'RAD DREHEN', spinning: 'RAD DREHT …', result: 'ERGEBNIS LÄUFT' };

        // Toasts only for actions whose effect is not already visible on this panel.
        const ACTION_MESSAGES = {
            reset: 'Rad zurückgesetzt',
            result_finished: 'Ergebnis beendet',
            reset_scores: 'Spielstand zurückgesetzt',
            set_timers: 'Übernommen',
            set_active_match: 'Spiel geladen',
            confirm_match_score: 'Ergebnis gespeichert',
        };
        const TEAM_ACTION_MESSAGES = {
            create_teams: 'Teams erstellt',
            reset_teams: 'Teams zurückgesetzt',
            reset_all: 'Alle Spieler gelöscht',
            remove_player: 'Spieler entfernt',
            update_settings: 'Einstellungen gespeichert',
        };

        // Destructive buttons need a second tap — only when they would destroy something.
        const CONFIRM_RULES = {
            'reset':           () => disabledEvents().length > 0 || gameState.phase !== PHASE_WHEEL,
            'reset_scores':    () => scoresNonZero(),
            'set-timers':      () => clockStarted(),
            'activate-match':  () => scoresNonZero(),
            'create-teams':    () => teamsExist(),
            'reshuffle-teams': () => teamsExist(),
            'reset-teams':     () => teamsExist(),
            'reset-all-teams': () => !!teamState && teamState.players.length > 0,
        };

        // --- DOM ---
        const $ = (id) => document.getElementById(id);
        const spinBtn = $('spinBtn');
        const endResultBtn = $('endResultBtn');
        const startBtn = $('startBtn');
        const pauseBtn = $('pauseBtn');
        const matchPanel = $('match-panel');
        const matchSelect = $('matchSelect');
        const matchInfo = $('matchInfo');
        const tournamentPopup = $('tournament-popup');

        // --- STATE ---
        let gameState = null;          // latest snapshot from /api/stream
        let teamState = null;          // latest snapshot from /api/team_stream
        let loadedFilesKey = null;     // wheel_files the checklist was built from
        let clockEndMs = null;         // Date.now() + remaining while the game clock runs
        let spinningSinceMs = null;    // when this panel first saw the current spin
        let spinPending = false;       // spin request in flight
        let activeMatchIndex = null;   // game_index of the active match, null when none
        let statusTimeout = null;
        const confirmTimers = new WeakMap();

        // =================================================================
        // GAME STATE (live via SSE) — every control is derived from it
        // =================================================================
        const ctrlStream = new EventSource('/api/stream');
        ctrlStream.onopen = () => renderConnection(true);
        ctrlStream.onerror = () => renderConnection(ctrlStream.readyState === EventSource.OPEN);
        ctrlStream.onmessage = (event) => applyGameState(JSON.parse(event.data));

        function applyGameState(data) {
            // A command response can arrive after a newer SSE snapshot — keep the newest.
            if (gameState && data.command_id < gameState.command_id) return;
            const first = gameState === null;
            if (data.phase !== PHASE_SPINNING) spinningSinceMs = null;
            else if (spinningSinceMs === null) spinningSinceMs = Date.now();
            gameState = data;

            if (first) fillSettingInputs(data.config);
            clockEndMs = data.config.global_timer_running
                ? Date.now() + data.config.global_time_remaining * 1000
                : null;

            syncEventChecklist(data);
            renderEventsBtn(data.show_events);
            renderSizeDisplays(data.config);
            renderActiveMatch(data.active_match);
            renderScores(data);
            renderLive();
        }

        function fillSettingInputs(cfg) {
            $('globalTimeInput').value = Math.round(cfg.global_time_total / 60);
            $('resultTimeInput').value = cfg.result_duration;
        }

        function disabledEvents() {
            return gameState ? gameState.disabled_events : [];
        }

        function activeEventCount() {
            const disabled = new Set(disabledEvents());
            return (gameState.wheel_files || []).filter(f => !disabled.has(f)).length;
        }

        function scoresNonZero() {
            return !!gameState && (gameState.scores.left > 0 || gameState.scores.right > 0);
        }

        function teamsExist() {
            return !!teamState && teamState.teams.length > 0;
        }

        // --- Game clock (ticks locally between snapshots, like the display) ---
        function clockRemainingSec() {
            if (clockEndMs !== null) return Math.max(0, (clockEndMs - Date.now()) / 1000);
            return gameState ? gameState.config.global_time_remaining : 0;
        }

        function clockExpired() {
            return clockRemainingSec() <= 0;
        }

        function clockRunning() {
            return clockEndMs !== null && !clockExpired();
        }

        function clockStarted() {
            return !!gameState &&
                (clockRunning() || clockRemainingSec() < gameState.config.global_time_total);
        }

        function formatClock(totalSec) {
            const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
            const s = Math.floor(totalSec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // --- Rendering ---
        function renderLive() {
            if (!gameState) return;
            renderClock();
            renderPhase();
        }

        function renderClock() {
            const remaining = clockRemainingSec();
            // Same rounding as the display: up while running, down while paused.
            $('statusClock').textContent = formatClock(clockEndMs !== null ? Math.ceil(remaining) : remaining);
            const expired = clockExpired();
            const running = clockRunning();
            $('statusClock').classList.toggle('expired', expired);
            $('statusClockState').textContent = expired ? 'Abgelaufen' : running ? 'Läuft' : 'Pausiert';
            startBtn.textContent = clockStarted() && !expired ? 'WEITER' : 'START';
            startBtn.disabled = running || expired;
            pauseBtn.disabled = !running;
        }

        function renderPhase() {
            const phase = gameState.phase;
            const active = activeEventCount();
            const total = (gameState.wheel_files || []).length;
            const stale = phase === PHASE_SPINNING && spinningSinceMs !== null &&
                Date.now() - spinningSinceMs > SPIN_STALE_MS;

            $('statusPhase').textContent = stale ? 'Keine Rückmeldung' : PHASE_LABELS[phase];
            $('statusEvents').textContent = `${active}/${total} Ereignisse`;

            if (phase === PHASE_WHEEL && active === 0) spinBtn.textContent = 'KEINE EREIGNISSE';
            else if (stale) spinBtn.textContent = 'ERNEUT DREHEN';
            else spinBtn.textContent = SPIN_LABELS[phase];
            spinBtn.disabled = spinPending || active === 0 || !(phase === PHASE_WHEEL || stale);
            endResultBtn.disabled = phase !== PHASE_RESULT;
        }

        function renderScores(data) {
            const left = data.active_match ? data.active_match.home : 'Heim';
            const right = data.active_match ? data.active_match.away : 'Gast';
            $('statusLabelLeft').textContent = left;
            $('statusLabelRight').textContent = right;
            $('scoreLabelLeft').textContent = left;
            $('scoreLabelRight').textContent = right;
            $('statusScoreLeft').textContent = data.scores.left;
            $('statusScoreRight').textContent = data.scores.right;
        }

        function renderConnection(online) {
            $('connDot').classList.toggle('online', online);
            $('connText').textContent = online ? 'Live' : 'Getrennt';
        }

        function renderEventsBtn(visible) {
            $('eventsBtn').textContent = visible ? 'EREIGNISSE VERBERGEN' : 'EREIGNISSE ANZEIGEN';
        }

        function renderSizeDisplays(cfg) {
            $('timerSizeDisplay').textContent = cfg.global_timer_size.toFixed(1) + ' rem';
            $('scoreSizeDisplay').textContent = cfg.score_size.toFixed(1) + ' rem';
        }

        setInterval(renderLive, CLOCK_TICK_MS);

        // --- Event checklist (rebuilt when images are added/removed on the server) ---
        function syncEventChecklist(data) {
            const filesKey = JSON.stringify(data.wheel_files || []);
            if (filesKey === loadedFilesKey) {
                syncCheckboxes();
                return;
            }
            loadedFilesKey = filesKey;
            loadEventChecklist();
        }

        function syncCheckboxes() {
            const disabled = new Set(disabledEvents());
            document.querySelectorAll('#events-checklist input[type=checkbox]').forEach(cb => {
                const active = !disabled.has(cb.dataset.filename);
                cb.checked = active;
                cb.closest('label').classList.toggle('event-off', !active);
            });
        }

        function loadEventChecklist() {
            fetch('/api/get_wheel_data')
                .then(r => r.json())
                .then(items => {
                    const container = $('events-checklist');
                    container.replaceChildren(...items.map(buildEventCheckItem));
                    syncCheckboxes();
                })
                .catch(() => { loadedFilesKey = null; });   // retried on the next snapshot
        }

        function buildEventCheckItem(item) {
            const label = document.createElement('label');
            label.className = 'event-check-item';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.dataset.filename = item.filename;
            cb.addEventListener('change', onEventCheckChange);
            const img = document.createElement('img');
            img.src = '/static/' + item.path;
            img.alt = '';
            const text = document.createElement('span');
            text.textContent = item.text;
            label.append(cb, img, text);
            return label;
        }

        function onEventCheckChange() {
            const disabled = [];
            document.querySelectorAll('#events-checklist input[type=checkbox]').forEach(c => {
                c.closest('label').classList.toggle('event-off', !c.checked);
                if (!c.checked) disabled.push(c.dataset.filename);
            });
            sendAction('set_disabled_events', { events: disabled });
        }

        // =================================================================
        // COMMANDS
        // =================================================================
        function showStatus(ok, text) {
            const el = $('status-msg');
            el.textContent = text;
            el.className = 'show ' + (ok ? 'ok' : 'err');
            clearTimeout(statusTimeout);
            statusTimeout = setTimeout(() => { el.className = ''; }, STATUS_TOAST_MS);
        }

        // Reads the server's error message from a failed response, falling back to the status code.
        function throwServerError(res) {
            return res.json()
                .catch(() => ({}))
                .then(d => { throw new Error(d.message || `Serverfehler ${res.status}`); });
        }

        // Resolves with the response body on success, or null on failure (already reported).
        function postCommand(url, action, payload, messages) {
            return fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, payload })
            })
            .then(res => res.ok ? res.json() : throwServerError(res))
            .then(body => {
                if (messages[action]) showStatus(true, messages[action]);
                return body;
            })
            .catch(err => {
                // fetch() rejects with a TypeError when the server is unreachable.
                showStatus(false, err instanceof TypeError ? 'Keine Verbindung zum Server' : err.message);
                return null;
            });
        }

        // Applies the returned state right away so the panel reacts even if SSE lags.
        function sendAction(action, payload = {}) {
            return postCommand('/api/send_command', action, payload, ACTION_MESSAGES).then(body => {
                if (!body) return null;
                applyGameState(body.state);
                return body.state;
            });
        }

        function sendTeamCommand(action, payload = {}) {
            return postCommand('/api/team_command', action, payload, TEAM_ACTION_MESSAGES);
        }

        function spin() {
            spinPending = true;   // blocks a double tap before the new phase arrives
            renderPhase();
            sendAction('spin').finally(() => {
                spinPending = false;
                renderPhase();
            });
        }

        function updateScore(side, change) {
            sendAction('update_score', { side, change });
        }

        function setTimers() {
            const globalMin = parseInt($('globalTimeInput').value, 10);
            if (isNaN(globalMin) || globalMin < 1) { showStatus(false, 'Ungültiger Wert'); return; }
            sendAction('set_timers', { global_time: globalMin * 60 });
        }

        function setResultDuration() {
            const resultSec = parseInt($('resultTimeInput').value, 10);
            if (isNaN(resultSec) || resultSec < 5) { showStatus(false, 'Mindestens 5 Sekunden'); return; }
            sendAction('set_timers', { result_duration: resultSec });
        }

        function adjustTimerSize(delta) {
            const size = Math.max(TIMER_SIZE_MIN, Math.min(TIMER_SIZE_MAX, gameState.config.global_timer_size + delta));
            sendAction('set_timer_size', { size });
        }

        function adjustScoreSize(delta) {
            const size = Math.max(SCORE_SIZE_MIN, Math.min(SCORE_SIZE_MAX, gameState.config.score_size + delta));
            sendAction('set_score_size', { size });
        }

        // =================================================================
        // TEAM STATE (live via SSE)
        // =================================================================
        const teamStream = new EventSource('/api/team_stream');
        teamStream.onmessage = (event) => applyTeamState(JSON.parse(event.data));

        function applyTeamState(data) {
            teamState = data;
            populateRemovePlayerSelect(data.players || []);
            const schedule = data.schedule || [];
            if (data.phase === 'teams_created' && schedule.length > 0) {
                matchPanel.style.display = '';
                populateMatchSelect(schedule);
            } else {
                matchPanel.style.display = 'none';
            }
        }

        // Rebuilds a <select> while keeping the operator's current choice if it still exists.
        function repopulateSelect(sel, placeholderValue, placeholderText, buildOptions) {
            const previous = sel.value;
            sel.innerHTML = '';
            const placeholder = document.createElement('option');
            placeholder.value = placeholderValue;
            placeholder.textContent = placeholderText;
            sel.appendChild(placeholder);
            buildOptions(sel);
            sel.value = previous;
            if (sel.value !== previous) sel.value = placeholderValue;
        }

        function populateRemovePlayerSelect(players) {
            repopulateSelect($('removePlayerSelect'), '', '— Spieler entfernen —', sel => {
                players.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.position === 'goalkeeper' ? `${p.name} (TW)` : p.name;
                    sel.appendChild(opt);
                });
            });
        }

        function populateMatchSelect(schedule) {
            repopulateSelect(matchSelect, '-1', '— Spiel wählen —', sel => {
                schedule.forEach((m, i) => {
                    const played = m.score_home !== null;
                    const label = `Spiel ${m.game}: ${m.home} vs ${m.away}` +
                        (played ? ` (${m.score_home}:${m.score_away})` : '');
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = label;
                    if (played) opt.style.opacity = '0.5';
                    sel.appendChild(opt);
                });
            });
        }

        // Only touches the dropdown when the active match actually changes, so the
        // operator can browse the next match while a game is running.
        function renderActiveMatch(active) {
            const nextIndex = active ? active.game_index : null;
            if (nextIndex === activeMatchIndex) return;
            activeMatchIndex = nextIndex;
            if (active) {
                matchInfo.textContent = `Aktiv: ${active.home} vs ${active.away}`;
                matchInfo.className = 'match-info active';
                matchSelect.value = String(active.game_index);
            } else {
                matchInfo.textContent = 'Kein Spiel ausgewählt';
                matchInfo.className = 'match-info';
            }
        }

        matchSelect.addEventListener('change', () => {
            const m = teamState && teamState.schedule[parseInt(matchSelect.value, 10)];
            matchInfo.textContent = m ? `${m.home} vs ${m.away}` : 'Kein Spiel ausgewählt';
            matchInfo.className = 'match-info';
        });

        function activateMatch() {
            const idx = parseInt(matchSelect.value, 10);
            if (idx < 0) { showStatus(false, 'Bitte Spiel wählen'); return; }
            sendAction('set_active_match', { game_index: idx });
        }

        function confirmMatchScore() {
            sendAction('confirm_match_score').then(state => {
                if (!state) return;
                matchInfo.textContent = 'Ergebnis gespeichert!';
                matchInfo.className = 'match-info';
                matchSelect.value = '-1';
            });
        }

        function removeSelectedPlayer() {
            const id = $('removePlayerSelect').value;
            if (!id) { showStatus(false, 'Bitte Spieler wählen'); return; }
            sendTeamCommand('remove_player', { id });
        }

        // --- TOURNAMENT SETTINGS ---
        function openTournament() {
            if (teamState && teamState.settings) {
                $('numTeamsInput').value = teamState.settings.num_teams;
                $('numGamesInput').value = teamState.settings.num_games;
            }
            tournamentPopup.classList.add('visible');
        }

        function closeTournament() {
            tournamentPopup.classList.remove('visible');
        }

        function saveTournament() {
            const numTeams = parseInt($('numTeamsInput').value, 10);
            const numGames = parseInt($('numGamesInput').value, 10);
            if (isNaN(numTeams) || numTeams < 2 || numTeams > 20) {
                showStatus(false, 'Teams: 2–20');
                return;
            }
            if (isNaN(numGames) || numGames < 1 || numGames > 3) {
                showStatus(false, 'Spiele: 1–3');
                return;
            }
            sendTeamCommand('update_settings', { num_teams: numTeams, num_games: numGames });
            closeTournament();
        }

        // Close popup on overlay click (not on card click)
        tournamentPopup.addEventListener('click', (e) => {
            if (e.target === tournamentPopup) closeTournament();
        });

        // =================================================================
        // INPUT: confirm-by-second-tap, click delegation, keyboard
        // =================================================================
        // Returns true when the action may run now; otherwise arms the button and
        // waits for a second tap within CONFIRM_WINDOW_MS.
        function confirmed(btn, action) {
            const rule = CONFIRM_RULES[action];
            if (!rule || !gameState || !rule()) return true;
            if (btn.classList.contains('confirming')) {
                disarmConfirm(btn);
                return true;
            }
            btn.dataset.label = btn.textContent;
            btn.textContent = 'SICHER? NOCHMAL TIPPEN';
            btn.classList.add('confirming');
            confirmTimers.set(btn, setTimeout(() => disarmConfirm(btn), CONFIRM_WINDOW_MS));
            return false;
        }

        function disarmConfirm(btn) {
            clearTimeout(confirmTimers.get(btn));
            btn.classList.remove('confirming');
            btn.textContent = btn.dataset.label;
        }

        function handleAction(action, btn) {
            switch (action) {
                case 'spin':                return spin();
                case 'end-result':          return sendAction('result_finished');
                case 'reset':
                case 'reset_scores':        return sendAction(action);
                case 'toggle-events':       return sendAction('toggle_events');
                case 'set-timers':          return setTimers();
                case 'set-result-duration': return setResultDuration();
                case 'timer-start':         return sendAction('control_global_timer', { state: 'start' });
                case 'timer-stop':          return sendAction('control_global_timer', { state: 'stop' });
                case 'timer-size-up':       return adjustTimerSize(+SIZE_STEP_REM);
                case 'timer-size-down':     return adjustTimerSize(-SIZE_STEP_REM);
                case 'score':               return updateScore(btn.dataset.side, parseInt(btn.dataset.change, 10));
                case 'score-size-up':       return adjustScoreSize(+SIZE_STEP_REM);
                case 'score-size-down':     return adjustScoreSize(-SIZE_STEP_REM);
                case 'create-teams':
                case 'reshuffle-teams':     return sendTeamCommand('create_teams');
                case 'reset-teams':         return sendTeamCommand('reset_teams');
                case 'reset-all-teams':     return sendTeamCommand('reset_all');
                case 'remove-player':       return removeSelectedPlayer();
                case 'activate-match':      return activateMatch();
                case 'confirm-score':       return confirmMatchScore();
                case 'open-tournament':     return openTournament();
                case 'close-tournament':    return closeTournament();
                case 'save-tournament':     return saveTournament();
            }
        }

        document.body.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn || btn.disabled || !gameState) return;
            // Drop focus after a pointer click so Space triggers the spin shortcut
            // instead of re-clicking the last button.
            if (e.detail > 0) btn.blur();
            if (!confirmed(btn, btn.dataset.action)) return;
            handleAction(btn.dataset.action, btn);
        });

        // Keyboard shortcuts for an operator on a laptop.
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey || e.altKey || e.repeat || !gameState) return;
            if (e.target.closest('input, select, textarea, button, a')) return;
            if (tournamentPopup.classList.contains('visible')) return;
            const change = e.shiftKey ? -1 : 1;
            switch (e.key) {
                case ' ':
                    e.preventDefault();
                    if (!spinBtn.disabled) spin();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    updateScore('left', change);
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    updateScore('right', change);
                    break;
                case 'p':
                case 'P':
                    if (!startBtn.disabled) handleAction('timer-start');
                    else if (!pauseBtn.disabled) handleAction('timer-stop');
                    break;
            }
        });

        // Keep a phone's screen on while the panel is open. Not supported everywhere
        // (needs HTTPS or localhost); the panel works without it.
        function keepScreenAwake() {
            if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
            navigator.wakeLock.request('screen').catch(() => {});
        }
        document.addEventListener('visibilitychange', keepScreenAwake);
        keepScreenAwake();
    </script>
</body>
</html>
